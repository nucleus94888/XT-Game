name: Web → GitHub Pages（iPhone Safari 測試用）

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 快取 Godot 與匯出範本
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/godot-cache
          key: godot-${{ env.GODOT_VERSION }}-linux-v1

      - name: 下載 Godot 與匯出範本
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/godot-cache && cd ~/godot-cache
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"

      - name: 安裝 Godot
        run: |
          set -euo pipefail
          cd ~/godot-cache
          unzip -oq godot.zip
          sudo mv -f "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -oq templates.tpz -d /tmp/tpz
          mv -f /tmp/tpz/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          godot --version

      - name: 匯入資源
        run: godot --headless --path hanzo --import || true

      - name: 匯出 Web（單執行緒，iOS Safari 相容）
        run: |
          set -euo pipefail
          mkdir -p build/web
          godot --headless --path hanzo --export-release "Web" ../build/web/index.html
          touch build/web/.nojekyll
          ls -la build/web

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
