name: iOS（雲端 Mac 建置）

# 兩個工作：
#  simulator  — 每次 push 都跑：Godot 匯出 Xcode 專案 → xcodebuild 編譯 iOS 模擬器版（免簽章、免 Apple 帳號）。
#               這證明「Windows 寫碼 → GitHub 的 Mac 幫你編 iOS」整條路是通的。
#  testflight — 手動觸發且勾選 testflight 才跑：用你提供的憑證簽章、打包 .ipa、上傳 TestFlight。
#               需要 7 個 Secrets，見 PIPELINE.md。

on:
  push:
    branches: [main]
    paths:
      - "hanzo/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:
    inputs:
      testflight:
        description: "簽章並上傳 TestFlight（需先設定 Apple secrets）"
        type: boolean
        default: false

env:
  GODOT_VERSION: "4.7.2"
  APP_NAME: Hanzo

jobs:
  simulator:
    name: 模擬器建置（免簽章）
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 快取 Godot 與匯出範本
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/godot-cache
          key: godot-${{ env.GODOT_VERSION }}-macos-v1

      - name: 下載 Godot 與匯出範本
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/godot-cache && cd ~/godot-cache
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
          curl -fsSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"

      - name: 安裝 Godot
        run: |
          set -euo pipefail
          cd ~/godot-cache
          unzip -oq godot.zip
          xattr -cr Godot.app || true
          TPL="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$TPL"
          unzip -oq templates.tpz -d /tmp/tpz
          mv -f /tmp/tpz/templates/* "$TPL/"
          echo "GODOT=$HOME/godot-cache/Godot.app/Contents/MacOS/Godot" >> "$GITHUB_ENV"
          "$HOME/godot-cache/Godot.app/Contents/MacOS/Godot" --version

      - name: 匯入資源
        run: "$GODOT" --headless --path hanzo --import || true

      - name: 匯出 Xcode 專案
        run: |
          set -euo pipefail
          mkdir -p build/ios
          "$GODOT" --headless --path hanzo --export-release "iOS" "../build/ios/${APP_NAME}.xcodeproj"
          ls -la build/ios

      - name: xcodebuild（iOS 模擬器，免簽章）
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild \
            -project "build/ios/${APP_NAME}.xcodeproj" \
            -scheme "${APP_NAME}" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build/ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            build | tee build/ios/xcodebuild.log | grep -E "error:|warning: .*deprecated|BUILD SUCCEEDED|BUILD FAILED" || true
          grep -q "BUILD SUCCEEDED" build/ios/xcodebuild.log

      - name: 打包模擬器 .app
        run: |
          set -euo pipefail
          APP=$(find build/ios/DerivedData/Build/Products -name "${APP_NAME}.app" -type d | head -n 1)
          echo "app: $APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "build/ios/${APP_NAME}-simulator.app.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-ios-simulator
          path: |
            build/ios/${{ env.APP_NAME }}-simulator.app.zip
            build/ios/xcodebuild.log
          retention-days: 14

  testflight:
    name: 簽章 + 上傳 TestFlight
    if: github.event_name == 'workflow_dispatch' && inputs.testflight
    runs-on: macos-15
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
      APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
      APPLE_PROFILE_BASE64: ${{ secrets.APPLE_PROFILE_BASE64 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - name: 檢查 Secrets
        run: |
          set -euo pipefail
          missing=0
          for v in APPLE_TEAM_ID APPLE_CERT_P12_BASE64 APPLE_CERT_PASSWORD APPLE_PROFILE_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER_ID APPLE_API_KEY_P8_BASE64; do
            if [ -z "${!v:-}" ]; then echo "::error::缺少 secret: $v（設定方式見 PIPELINE.md）"; missing=1; fi
          done
          [ "$missing" = 0 ]

      - name: 快取 Godot 與匯出範本
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/godot-cache
          key: godot-${{ env.GODOT_VERSION }}-macos-v1

      - name: 下載 Godot 與匯出範本
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/godot-cache && cd ~/godot-cache
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
          curl -fsSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"

      - name: 安裝 Godot
        run: |
          set -euo pipefail
          cd ~/godot-cache
          unzip -oq godot.zip
          xattr -cr Godot.app || true
          TPL="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$TPL"
          unzip -oq templates.tpz -d /tmp/tpz
          mv -f /tmp/tpz/templates/* "$TPL/"
          echo "GODOT=$HOME/godot-cache/Godot.app/Contents/MacOS/Godot" >> "$GITHUB_ENV"

      - name: 匯入簽章憑證到暫時 keychain
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "" "$KC"
          echo "$APPLE_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "" "$KC"
          security list-keychains -d user -s "$KC" login.keychain-db
          security find-identity -v -p codesigning "$KC"

      - name: 安裝 Provisioning Profile
        run: |
          set -euo pipefail
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$APPLE_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" "$RUNNER_TEMP/profile.plist")
          NAME=$(/usr/libexec/PlistBuddy -c "Print Name" "$RUNNER_TEMP/profile.plist")
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"
          echo "profile: $NAME ($UUID)"

      - name: 寫入 Team ID 與 Profile 到匯出設定
        run: |
          set -euo pipefail
          f=hanzo/export_presets.cfg
          sed -i '' "s#^application/app_store_team_id=.*#application/app_store_team_id=\"${APPLE_TEAM_ID}\"#" "$f"
          sed -i '' "s#^application/provisioning_profile_uuid_release=.*#application/provisioning_profile_uuid_release=\"${PROFILE_UUID}\"#" "$f"
          sed -i '' "s#^application/provisioning_profile_specifier_release=.*#application/provisioning_profile_specifier_release=\"${PROFILE_NAME}\"#" "$f"
          sed -i '' "s#^application/code_sign_identity_release=.*#application/code_sign_identity_release=\"Apple Distribution\"#" "$f"
          grep -E "team_id|provisioning_profile_(uuid|specifier)_release|code_sign_identity_release" "$f"

      - name: 匯入資源
        run: "$GODOT" --headless --path hanzo --import || true

      - name: 匯出 Xcode 專案
        run: |
          set -euo pipefail
          mkdir -p build/ios
          "$GODOT" --headless --path hanzo --export-release "iOS" "../build/ios/${APP_NAME}.xcodeproj"

      - name: xcodebuild archive
        run: |
          set -euo pipefail
          xcodebuild \
            -project "build/ios/${APP_NAME}.xcodeproj" \
            -scheme "${APP_NAME}" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            archive -archivePath "build/ios/${APP_NAME}.xcarchive" \
            | tee build/ios/archive.log | grep -E "error:|ARCHIVE SUCCEEDED|ARCHIVE FAILED" || true
          grep -q "ARCHIVE SUCCEEDED" build/ios/archive.log

      - name: 匯出 .ipa
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "build/ios/${APP_NAME}.xcarchive" \
            -exportOptionsPlist "build/ios/${APP_NAME}/export_options.plist" \
            -exportPath build/ios/export \
            | tee build/ios/export.log | grep -E "error:|EXPORT SUCCEEDED|EXPORT FAILED" || true
          grep -q "EXPORT SUCCEEDED" build/ios/export.log
          ls -la build/ios/export

      - name: 上傳 TestFlight
        run: |
          set -euo pipefail
          mkdir -p "$HOME/private_keys"
          echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$HOME/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          IPA=$(ls build/ios/export/*.ipa | head -n 1)
          xcrun altool --upload-app -t ios -f "$IPA" --apiKey "$APPLE_API_KEY_ID" --apiIssuer "$APPLE_API_ISSUER_ID"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ env.APP_NAME }}-ios-ipa
          path: |
            build/ios/export/*.ipa
            build/ios/*.log
          retention-days: 14
