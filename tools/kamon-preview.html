<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kamon preview</title>
    <style>
      html, body { margin: 0; background: #f3ead8; font-family: system-ui, sans-serif; color: #1a1a1a; }
      h1 { font-size: 18px; font-weight: 600; margin: 20px 24px 8px; }
      p { margin: 0 24px 16px; font-size: 13px; opacity: 0.7; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; padding: 0 24px 40px; }
      .cell { display: flex; flex-direction: column; align-items: center; gap: 8px; }
      .cell svg { width: 160px; height: 160px; }
      .cell img { width: 80px; height: 80px; }
      .cell .label { font-size: 12px; text-align: center; line-height: 1.4; }
      .cell .label b { font-family: ui-monospace, monospace; font-weight: 500; }
      .row { display: flex; gap: 8px; align-items: center; }
    </style>
  </head>
  <body>
    <h1>家紋 preview</h1>
    <p>Large: inline SVG from <code>kamonSvg()</code>. Small: <code>&lt;img&gt;</code> fed by <code>kamonDataUrl()</code> (red tint to prove colour override).</p>
    <div class="grid" id="grid"></div>
    <script type="module">
      import { KAMON_IDS, kamonSvg, kamonDataUrl } from '../src/data/kamon.ts';

      const NAMES = {
        oda_mokko: '織田木瓜',
        ashikaga_futatsubiki: '足利二つ引両',
        takeda_bishi: '武田菱',
        uesugi_take_ni_suzume: '竹に雀',
        hojo_mitsuuroko: '三つ鱗',
        mori_ichimonji_mitsuboshi: '一文字三星',
        miyoshi_sangaibishi: '三階菱',
        chosokabe_katabami: '七つ片喰',
        shimazu_juji: '丸に十字',
        otomo_gyoyo: '杏葉',
        ryuzoji_hiashi: '日足',
        amago_yotsumeyui: '平四つ目結',
        tsutsui_umebachi: '梅鉢',
        azai_kikko: '三つ盛亀甲',
        asakura_mokko: '三つ盛木瓜',
        saito_tatsunami: '二頭立波',
        kitabatake_waribishi: '割菱',
        date_mitsubiki: '三つ引両',
      };

      const grid = document.getElementById('grid');
      for (const id of KAMON_IDS) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.innerHTML = kamonSvg(id);
        const row = document.createElement('div');
        row.className = 'row';
        const img = document.createElement('img');
        img.src = kamonDataUrl(id, '#8b1a1a');
        img.alt = id;
        row.appendChild(img);
        cell.appendChild(row);
        const label = document.createElement('div');
        label.className = 'label';
        label.innerHTML = `${NAMES[id] ?? ''}<br><b>${id}</b>`;
        cell.appendChild(label);
        grid.appendChild(cell);
      }
    </script>
  </body>
</html>
